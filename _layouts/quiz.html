---
layout: default
---

<div class="quiz-page-wrapper">
  {{ content }}
</div>

<!-- Quizdown Core & Extensions -->
<script src="https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/quizdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/extensions/quizdownHighlight.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/extensions/quizdownKatex.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    let config = {
      primaryColor: "{{ page.primary_color | default: '#2563eb' }}",
      shuffleQuestions: {{ page.shuffle_questions | default: false }},
      shuffleAnswers: {{ page.shuffle_answers | default: true }}
    };
    quizdown
      .register(quizdownHighlight)
      .register(quizdownKatex)
      .init(config);
  });
</script>

<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    document.querySelectorAll('.quizdown').forEach((quizHost) => {
      const shadow = quizHost.shadowRoot;
      if (!shadow) return;

      // 1. Inject custom background styles into the Shadow DOM
      const style = document.createElement('style');
      style.textContent = `
        /* Target result rows marked by our observer */
        .result-row-correct {
          background-color: #d4edda !important;
          color: #155724 !important;
          border-radius: 6px;
          padding: 6px 10px;
          margin-bottom: 4px;
        }
        .result-row-wrong {
          background-color: #f8d7da !important;
          color: #721c24 !important;
          border-radius: 6px;
          padding: 6px 10px;
          margin-bottom: 4px;
        }
      `;
      shadow.appendChild(style);

      // 2. Watch for the results screen rendering and tag right/wrong rows
      const observer = new MutationObserver(() => {
        // 1. Replace "Your Quiz Results" heading text
        shadow.querySelectorAll('h1, h2, h3, .result-title, p').forEach((el) => {
          if (el.textContent && el.textContent.trim().toLowerCase() === 'your quiz results') {
            el.textContent = 'あなたのクイズ結果'; // <-- Put your custom text here
          }
        });
        // Quizdown uses green/red inline colors or checkmark/cross symbols on the result list
        shadow.querySelectorAll('li, tr, .result-line').forEach((row) => {
          const text = row.textContent || '';
          const html = row.innerHTML || '';

          if (text.includes('✓') || text.includes('✔') || html.includes('green') || row.querySelector('.correct')) {
            row.classList.add('result-row-correct');
          } else if (text.includes('✗') || text.includes('✘') || text.includes('×') || html.includes('red') || row.querySelector('.wrong, .incorrect')) {
            row.classList.add('result-row-wrong');
          }
        });
      });

      observer.observe(shadow, { childList: true, subtree: true });
    });
  }, 200);
});
</script>
